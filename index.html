<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Next Step Study Room</title><meta name="description" content="Free, independent GED study foundations: 32 lessons, 80 original questions, mixed review, writing workshop and an eight-week plan."><style> :root{--ds-hairline:#eae9ea;--ds-raised:#f4efec;--ds-ink:#251f21;--ds-teal:#548c7c}*{box-sizing:border-box}body{margin:0;background:#f4efec;color:#251f21;font:16px/1.65 Arial,sans-serif}main{max-width:1000px;margin:0 auto;background:white;padding:36px}h1{font:normal 36px/1.2 Georgia,serif;margin:0 0 12px}h2{font:normal 25px/1.3 Georgia,serif}h3{font-size:20px}p{margin:12px 0}section{margin-top:32px;border-top:1px solid #eae9ea;padding-top:20px}button{font:inherit;cursor:pointer;border:1px solid #ccc;border-radius:6px;background:white;padding:10px 15px;min-height:44px}button[aria-pressed=true],button.primary{background:#e2efe9;border-color:#548c7c;color:#245849;font-weight:bold}button:disabled{color:#777;cursor:default;background:#f5f5f5}small{display:block;color:#585254;font-size:14px}aside{background:#f4efec;border-radius:10px;padding:20px;margin:24px 0}aside h3{margin:0}footer{border-top:1px solid #eae9ea;margin-top:36px;padding-top:20px;color:#585254;font-size:14px}.choices{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 20px}.choice-label{display:block;font-weight:bold}a{color:#245849}figure img{max-width:100%}figcaption{font-size:14px;color:#585254}ul{padding-left:24px}li{margin:8px 0}@media(max-width:600px){main{padding:22px}h1{font-size:30px}h2{font-size:23px}button{padding:9px 12px}}.lead{display:grid;gap:24px;margin:24px 0}.lead figure{margin:0}.lead img{max-height:240px;width:100%;object-fit:cover;border-radius:12px}.lesson{margin:24px 0}.question{border:1px solid var(--ds-hairline);border-radius:12px;padding:20px;margin:24px 0;min-width:0}.question legend{font-weight:600;padding:0 4px}.answer{display:flex;align-items:flex-start;gap:12px;min-height:44px;padding:10px 0;cursor:pointer}.answer input{margin-top:5px;flex-shrink:0;accent-color:var(--ds-teal)}.feedback{padding:16px;background:var(--ds-raised);border-radius:8px;margin-top:12px}.feedback p{margin:8px 0 0}.actions{display:flex;flex-wrap:wrap;gap:12px}.essay-label{display:block;font-weight:600;margin:20px 0 8px}textarea{width:100%;box-sizing:border-box;font:inherit;color:var(--ds-ink);border:1px solid var(--ds-hairline);border-radius:8px;padding:12px;resize:vertical}details{margin:20px 0}summary{cursor:pointer;padding:12px 0;min-height:44px}.sources{padding-left:20px}.sources li{margin:12px 0}@media(min-width:768px){.lead{grid-template-columns:1fr 1.3fr;align-items:center}}

</style></head><body><div id="root"></div><noscript>This study program needs JavaScript enabled for its lessons and practice tools.</noscript><script>const subjects=[{"id":"math","name":"Math","summary":"Numbers, geometry, algebra, graphs and functions.","time":"Official test: 115 minutes","lessons":[{"title":"Fractions, decimals and percentages","text":"A fraction is a part of a whole. To turn it into a decimal, divide the numerator by the denominator. A percent means per hundred. Multiply a decimal by 100 to get a percent. For a percent of an amount, convert to a decimal and multiply.","example":"A $60 jacket is 25% off: 0.25 × 60 = $15 off. The sale price is $45."},{"title":"Equations and rates","text":"Keep both sides of an equation equal. Undo addition or subtraction first, then multiplication or division. A unit rate describes one unit: divide total cost by the number of items. Use units to check your work.","example":"Solve 3x + 7 = 22. Subtract 7: 3x = 15. Divide by 3: x = 5. Check: 3 × 5 + 7 = 22."},{"title":"Area, averages and graphs","text":"Rectangle area is length × width in square units. The mean is the sum of values divided by the number of values. On a graph, read the axis labels and scale before comparing points. Slope is change in y divided by change in x.","example":"For (2, 5) and (6, 13), slope = (13 − 5) ÷ (6 − 2) = 8 ÷ 4 = 2."},{"title":"Order of operations and negative numbers","text":"Evaluate parentheses first, then exponents, multiplication and division from left to right, then addition and subtraction from left to right. A negative number is below zero. Subtracting a negative is the same as adding its opposite.","example":"6 + 2 × 3 = 12, not 24. Also, 5 − (−2) = 7."},{"title":"Ratios, proportion and unit conversions","text":"A ratio compares quantities. Equivalent ratios multiply or divide both terms by the same nonzero number. Set up conversions so unwanted units cancel. Keep area units separate from length units.","example":"A recipe uses 2 cups of rice for 5 servings. Ten servings need 4 cups. Three feet equal one yard, so 12 feet equal 4 yards."},{"title":"Geometry beyond rectangles","text":"Triangle area is half of base × perpendicular height. Circle area is πr² and circumference is 2πr. The Pythagorean theorem a² + b² = c² applies to right triangles, with c the hypotenuse. Rectangular-prism volume is length × width × height.","example":"A triangle with base 10 cm and height 6 cm has area 30 cm². A box 3 by 4 by 5 cm has volume 60 cm³."},{"title":"Inequalities, functions and slope","text":"An inequality describes a range of values. Flip its sign when multiplying or dividing by a negative number. A function gives exactly one output for each allowed input. In y = mx + b, m is the slope and b is the y-intercept.","example":"−2x < 6 becomes x > −3. For y = 3x + 2 and x = 4, y = 14."},{"title":"Powers, square roots and algebraic expressions","text":"An exponent counts repeated multiplication. A square root reverses squaring for a nonnegative principal root. Combine like terms and distribute multiplication across parentheses. A quadratic can sometimes be factored by finding two numbers with the needed sum and product.","example":"2³ = 8; √49 = 7. Also, 3(x + 2) = 3x + 6. x² + 5x + 6 = (x + 2)(x + 3)."}],"questions":[{"prompt":"What is 3/5 as a percentage?","options":["35%","60%","80%","150%"],"answer":1,"why":"3 ÷ 5 = 0.6. Multiply by 100 to get 60%."},{"prompt":"A $48 item is discounted by 25%. What is the sale price before tax?","options":["$12","$23","$36","$40"],"answer":2,"why":"The discount is 0.25 × 48 = $12. Subtract it from $48: $36."},{"prompt":"Solve 4x − 6 = 18.","options":["3","4.5","6","12"],"answer":2,"why":"Add 6 to each side: 4x = 24. Divide by 4: x = 6."},{"prompt":"Three notebooks cost $7.50 in total. What is the cost of one notebook?","options":["$2.50","$3.00","$4.50","$22.50"],"answer":0,"why":"Divide $7.50 by 3 notebooks: $2.50 per notebook."},{"prompt":"A rectangular floor is 12 feet long and 8 feet wide. What is its area?","options":["20 square feet","40 square feet","96 square feet","192 square feet"],"answer":2,"why":"Area = length × width = 12 × 8 = 96 square feet."},{"prompt":"What is the mean of 4, 6, 8 and 10?","options":["6","7","8","28"],"answer":1,"why":"The sum is 28. There are 4 values. 28 ÷ 4 = 7."},{"prompt":"Evaluate 7 + 3 × 4.","options":["19","40","28","21"],"answer":0,"why":"Multiply first: 3 × 4 = 12. Then 7 + 12 = 19."},{"prompt":"What is −3 − (−8)?","options":["−11","−5","5","11"],"answer":2,"why":"Subtracting −8 adds 8. −3 + 8 = 5."},{"prompt":"A mix uses 3 cups of flour for 12 muffins. How much flour is needed for 20 muffins at the same ratio?","options":["4 cups","5 cups","6 cups","8 cups"],"answer":1,"why":"3/12 = 1/4 cup per muffin. 20 × 1/4 = 5 cups."},{"prompt":"How many yards are 18 feet? Use 3 feet = 1 yard.","options":["3","6","15","54"],"answer":1,"why":"18 feet ÷ 3 feet per yard = 6 yards."},{"prompt":"A triangle has base 14 cm and perpendicular height 5 cm. What is its area?","options":["19 cm²","35 cm²","70 cm²","140 cm²"],"answer":1,"why":"Area = 1/2 × 14 × 5 = 35 cm²."},{"prompt":"A right triangle has legs 6 and 8. What is the hypotenuse length?","options":["7","10","14","48"],"answer":1,"why":"c² = 6² + 8² = 36 + 64 = 100, so c = 10."},{"prompt":"A box measures 2 m by 3 m by 4 m. What is its volume?","options":["9 m³","12 m³","24 m³","48 m³"],"answer":2,"why":"Volume = 2 × 3 × 4 = 24 m³."},{"prompt":"Solve −3x ≥ 12.","options":["x ≥ 4","x ≤ −4","x ≥ −4","x ≤ 4"],"answer":1,"why":"Divide by −3 and reverse the inequality: x ≤ −4."},{"prompt":"For y = 2x − 5, what is y when x = 6?","options":["1","7","12","17"],"answer":1,"why":"Substitute 6: 2 × 6 − 5 = 7."},{"prompt":"Which is the slope of y = −4x + 9?","options":["−4","4","9","−9"],"answer":0,"why":"In y = mx + b, m is slope. Here m = −4."},{"prompt":"Simplify 5a + 2a − 3.","options":["7a − 3","4a","10a − 3","7a + 3"],"answer":0,"why":"Combine the like a terms: 5a + 2a = 7a. The constant stays −3."},{"prompt":"Expand 4(x − 2).","options":["4x − 2","x − 8","4x − 8","4x + 8"],"answer":2,"why":"Distribute 4 to both terms: 4x − 8."},{"prompt":"Factor x² + 7x + 12.","options":["(x + 2)(x + 6)","(x + 3)(x + 4)","(x − 3)(x − 4)","(x + 1)(x + 12)"],"answer":1,"why":"3 + 4 = 7 and 3 × 4 = 12."},{"prompt":"A circle has radius 3 cm. Using π ≈ 3.14, what is its area?","options":["9.42 cm²","18.84 cm²","28.26 cm²","56.52 cm²"],"answer":2,"why":"Area = πr² ≈ 3.14 × 9 = 28.26 cm²."}]},{"id":"rla","name":"Language arts","summary":"Read closely, compare arguments and edit sentences.","time":"Official test: 150 minutes, including a 45-minute extended response","lessons":[{"title":"Central idea and evidence","text":"The central idea is what a passage mainly says, not a small detail. An inference is a conclusion supported by clues. Separate what the passage actually supports from what sounds possible. Point to a specific sentence or detail for evidence.","example":"If a passage says the library extended its evening hours and evening visits rose, it supports an increase in evening use. It does not prove every resident now reads more."},{"title":"Compare arguments","text":"Find each writer's claim, evidence and reasoning. Strong support is relevant and specific. Check whether the evidence really supports the claim, whether the source is credible, and whether the writer overlooks another explanation.","example":"A survey with a stated sample and clear results usually gives a stronger basis for a claim than one person's guess. Even a survey may have limits: who was surveyed, and how?"},{"title":"Clear sentences and essay structure","text":"Use subjects and verbs that agree. Separate complete sentences with a period or a semicolon, or join them with a conjunction and suitable punctuation. In an argument analysis, explain which position is better supported, use evidence from the texts, and explain why that evidence matters.","example":"Instead of \"The shop closed, the workers went home,\" write \"The shop closed, and the workers went home.\""},{"title":"Inference, tone and context clues","text":"Infer only what textual clues support. Tone is the writer's attitude, revealed through words and detail. For unfamiliar vocabulary, try the surrounding sentences and contrast words such as \"but.\" Check that your interpretation fits the whole passage.","example":"\"Despite the rain, Mira hummed as she walked home\" supports a cheerful or content mood. It does not show that she loves every storm."},{"title":"Text structure and summary","text":"Writers may organize by sequence, cause and effect, comparison or problem and solution. A summary keeps the central idea and major supporting points in your own words, without adding an opinion. Identify transitions and repeated themes.","example":"A passage that explains missed buses and then proposes a timetable fix uses problem-and-solution structure."},{"title":"Evidence quality and counterarguments","text":"A strong argument connects relevant evidence to a claim. Check sample selection, missing information and possible alternative explanations. A counterargument gives an opposing view; a response should address its strongest point rather than distort it.","example":"If a survey covers only current customers, it may not represent noncustomers. A careful writer explains that limit rather than claiming everyone agrees."},{"title":"Pronouns, verbs and sentence boundaries","text":"Pronouns should clearly refer to the intended noun. Keep verb tense consistent unless time changes. A fragment lacks a complete sentence structure; a run-on joins complete thoughts without suitable punctuation. Read your writing aloud to catch confusing references.","example":"\"When the class ended.\" is a fragment. \"When the class ended, we went home.\" is complete."},{"title":"Writing an evidence-based analysis","text":"Plan a claim about which argument has stronger support. Build paragraphs around one reason each, cite or accurately paraphrase text details, and explain their significance. Address a weakness or limitation. Finish with a conclusion that follows your analysis, then revise for clarity.","example":"A paragraph can follow this pattern: reason, specific evidence, explanation, limitation. Prefer explaining one useful piece of evidence to listing five unexplained details."}],"questions":[{"prompt":"Passage: \"The bus route added two evening trips. Evening ridership rose from 80 to 120 passengers a day.\" Which conclusion is supported?","options":["The route now runs all night.","More passengers used the route in the evening.","Everyone stopped driving.","The fares were reduced."],"answer":1,"why":"The passage gives an increase in evening ridership. It says nothing about all-night service, fares or every driver."},{"prompt":"Which evidence best supports a claim that a training program improved participants' reading scores?","options":["A trainer says the program feels helpful.","The room has new chairs.","Matched before-and-after reading scores increased for the participants.","The program has a catchy name."],"answer":2,"why":"Before-and-after scores directly address improvement. They support the claim, though further study would be needed to rule out other causes."},{"prompt":"Which sentence has correct subject-verb agreement?","options":["The students studies each evening.","The student study each evening.","The students study each evening.","The students studying each evening."],"answer":2,"why":"The plural subject \"students\" takes \"study.\" The other options have a mismatch or lack a complete verb."},{"prompt":"Which revision fixes the comma splice in \"It rained, the game was canceled\"?","options":["It rained the game was canceled.","It rained, so the game was canceled.","It, rained the game was canceled.","It rained the, game was canceled."],"answer":1,"why":"\"So\" joins the two complete clauses and explains the result."},{"prompt":"An author writes \"Only a foolish person would disagree\" instead of supplying evidence. What should a reader notice?","options":["This proves the claim.","The author is attacking disagreement rather than supporting the claim.","All opinions are now facts.","No more evidence is needed."],"answer":1,"why":"Insulting those who disagree is not evidence. Evaluate the claim using relevant support."},{"prompt":"What belongs in a response comparing two arguments?","options":["Only a personal story.","A list of unrelated facts.","A claim about which argument is better supported, with evidence and explanation.","The same sentence repeated."],"answer":2,"why":"An argument analysis needs a clear judgment, relevant textual evidence, and reasoning that connects the evidence to the judgment."},{"prompt":"\"Though her first attempt failed, Ana carefully reset the pieces and began again.\" What is best supported?","options":["Ana never makes mistakes.","Ana is willing to persist.","Ana dislikes every task.","Ana finished before starting."],"answer":1,"why":"Resetting and beginning again supports persistence, not perfection."},{"prompt":"\"The trail was arduous; after the steep climb, we rested for an hour.\" Arduous most nearly means:","options":["Easy","Difficult","Short","Invisible"],"answer":1,"why":"The steep climb and need for rest suggest difficulty."},{"prompt":"A passage compares two training schedules point by point. What structure is used?","options":["Comparison","Chronological biography only","A recipe","No organization"],"answer":0,"why":"Point-by-point differences and similarities indicate comparison."},{"prompt":"Which summary avoids adding an unsupported opinion?","options":["The writer is obviously foolish.","The article describes rising bus use and proposes additional evening service.","This is the greatest plan ever.","Everyone must agree immediately."],"answer":1,"why":"It states main content without inserting a personal judgment."},{"prompt":"A report says 8 of 10 volunteers liked a course. Which claim exceeds the evidence?","options":["Eight volunteers liked it.","Two did not say they liked it.","Every adult in the country would like it.","Most of these ten volunteers liked it."],"answer":2,"why":"A tiny volunteer sample cannot support a universal national claim."},{"prompt":"Which response addresses a cost counterargument?","options":["Anyone asking about cost is foolish.","Costs never matter.","The program's projected benefit should be compared with staffing costs.","Do not consider opposing views."],"answer":2,"why":"It engages the cost issue instead of dismissing it."},{"prompt":"Which sentence has a clear pronoun reference?","options":["When Lee met Pat, he was late.","They told them that it was there.","Lee arrived late to meet Pat.","This happened because of that."],"answer":2,"why":"Naming Lee identifies who was late; the others leave unclear references."},{"prompt":"Choose the complete sentence.","options":["Because the shop was closed.","After the long meeting.","The workers returned after lunch.","Running through the park."],"answer":2,"why":"It contains a subject and a complete predicate. The others are fragments."},{"prompt":"Which revision keeps past tense consistent?","options":["She opened the box and smiles.","She opens the box and smiled.","She opened the box and smiled.","She opening the box and smiled."],"answer":2,"why":"Both completed actions use past-tense verbs."},{"prompt":"Which sentence uses an apostrophe to show one teacher owns the notebook?","options":["The teachers notebook","The teacher's notebook","The teachers' notebook","The teachers notebook's"],"answer":1,"why":"A singular possessive adds apostrophe + s: teacher's."},{"prompt":"What is a good reason to include a quotation in an analysis?","options":["It replaces all reasoning.","It is relevant evidence for a point you explain.","It makes the response long regardless of relevance.","It proves every possible claim."],"answer":1,"why":"Use a relevant quote and explain how it supports your analysis."},{"prompt":"A writer calls a plan \"reckless\" and \"careless.\" What tone do these words suggest?","options":["Neutral approval","Criticism","Celebration","Indifference"],"answer":1,"why":"Both word choices express negative judgment."},{"prompt":"Which conclusion stays within the evidence: a six-week pilot attracted evening visitors?","options":["Nobody needs daytime service.","Every future month will have identical visits.","The pilot suggests demand during the tested weeks; longer-term use is uncertain.","All budgets are unlimited."],"answer":2,"why":"It recognizes the observation and its time limit."},{"prompt":"Which is the best revision strategy after a first draft?","options":["Remove all evidence.","Check each paragraph's point, evidence and explanation, then edit sentences.","Repeat the introduction everywhere.","Replace every word with a longer one."],"answer":1,"why":"Revision should improve reasoning and organization as well as sentence clarity."}]},{"id":"science","name":"Science","summary":"Interpret evidence, experiments, numbers and scientific ideas.","time":"Official test: 90 minutes","lessons":[{"title":"Experiments and variables","text":"The independent variable is what a researcher changes. The dependent variable is what is measured. Keep other important conditions the same to make a fair comparison. A control or comparison group helps show what happens without the treatment.","example":"To study light and plant growth, vary hours of light and measure growth. Keep plant type, water, soil and pot size the same."},{"title":"Data and conclusions","text":"Read labels, units and scales. Compare the actual numbers before drawing a conclusion. A relationship between two variables alone does not prove that one causes the other. Repeated trials and larger, appropriate samples can make evidence more useful.","example":"If one treatment averages 12 cm of growth and another averages 8 cm, the difference is 4 cm. This result applies to the tested conditions, not automatically to all plants."},{"title":"Life, physical and Earth science","text":"Use information in the passage even when a topic is unfamiliar. In a food web, arrows commonly show energy moving from food to the organism that consumes it. Physical changes such as melting change form without changing chemical identity. Weather describes short-term conditions; climate describes long-term patterns.","example":"Ice melting into liquid water is a physical change: both are water."},{"title":"Hypotheses, replication and measurement","text":"A testable hypothesis predicts something measurable. Repeating trials helps show variability; independent replication checks whether others obtain similar results. Instruments need suitable units and precision. A hypothesis should be revised when evidence contradicts it.","example":"\"Seeds given 8 hours of light will grow taller than those given 4 hours under the same conditions\" can be tested."},{"title":"Cells, heredity and ecosystems","text":"Cells are basic units of life. DNA carries genetic information; inherited variants can influence traits, along with environmental factors. In ecosystems, producers use an energy source to make food, while consumers obtain energy by eating. Decomposers recycle nutrients.","example":"Grass is a producer. A rabbit that eats grass is a consumer. Energy available generally decreases at successive food-chain levels."},{"title":"Matter, forces and energy","text":"Matter has mass and occupies space. A chemical change makes different substances; a physical change changes form or state. A net force can change motion. Energy changes form, but is conserved in an isolated system. Heat flows spontaneously from warmer to cooler objects.","example":"Rusting forms new substances and is a chemical change. An electric fan changes electrical energy into motion, sound and heat."},{"title":"Earth systems and the water cycle","text":"Evaporation turns liquid water into vapor; condensation turns vapor into liquid droplets; precipitation returns water to the surface. Earth processes act on different time scales. Use evidence and stated conditions, not one short observation, to evaluate a long-term claim.","example":"Water on a window after humid air cools is condensation. A single cool day does not establish a long-term climate trend."},{"title":"Probability, graphs and limits of conclusions","text":"For equally likely outcomes, probability is favorable outcomes divided by total outcomes. Read uncertainty and sample size with results. A graph can be misleading if its scale hides context. A conclusion should match the design and data rather than reach beyond them.","example":"A fair six-sided die has probability 1/6 of rolling a 4. A study of one species under one condition does not directly prove a result for all species."}],"questions":[{"prompt":"Researchers vary fertilizer amount and measure plant height. What is the dependent variable?","options":["Fertilizer amount","Plant height","The label on the pot","The calendar date alone"],"answer":1,"why":"Plant height is measured as an outcome. Fertilizer amount is the variable changed."},{"prompt":"In a study of light and plant growth, which should be kept the same for a fair comparison?","options":["Plant type and water amount","Hours of light","The measured final height","The final result"],"answer":0,"why":"Plant type and water can affect growth. Keep them the same while changing light."},{"prompt":"A sample averages 14 cm of growth with treatment and 9 cm without it. What is the difference?","options":["3 cm","5 cm","9 cm","23 cm"],"answer":1,"why":"14 − 9 = 5 cm. This is a difference, not a claim that all future plants will grow exactly 5 cm more."},{"prompt":"Ice changes to liquid water. Which statement describes this?","options":["A new chemical substance is formed.","Water disappears.","It is a physical change.","It must be a biological change."],"answer":2,"why":"The chemical identity remains water. Its state changes from solid to liquid."},{"prompt":"Ice cream sales and heat-related illness both rise in hot weather. What is the most careful conclusion?","options":["Ice cream is proven to cause every illness.","A shared factor, hot weather, may explain both increases.","Heat has no possible role.","The two numbers must be identical."],"answer":1,"why":"Correlation alone does not establish cause. Hot weather is a plausible shared factor."},{"prompt":"Which example describes climate rather than a single weather event?","options":["It rained at noon today.","Tomorrow's high is 82°F.","This region usually has dry summers over many years.","A storm arrived this morning."],"answer":2,"why":"Climate concerns long-term patterns. The other options concern short-term weather."},{"prompt":"Which hypothesis is testable?","options":["This plant is the most beautiful.","Plants given 10 mL more water daily will show greater height after two weeks under controlled conditions.","Good luck always wins.","All nature is nice."],"answer":1,"why":"Water amount, height and time are measurable."},{"prompt":"Why repeat trials in an experiment?","options":["To guarantee the preferred answer","To observe variability and improve confidence in the result","To remove the need for measurements","To change every condition at once"],"answer":1,"why":"Repeating measurements helps reveal variability; it does not guarantee a hypothesis."},{"prompt":"Which unit is appropriate for mass?","options":["Kilogram","Liter only","Degree Celsius","Meter per second"],"answer":0,"why":"Kilograms measure mass. Liters measure volume, Celsius temperature, and m/s speed."},{"prompt":"Which contains inherited genetic information?","options":["DNA","A ruler","A weather map","A calendar"],"answer":0,"why":"DNA carries genetic information."},{"prompt":"In a grass → rabbit → fox food chain, what is the grass?","options":["Producer","Top predator","Decomposer only","Nonliving matter"],"answer":0,"why":"Grass makes its food using an energy source, so it is a producer."},{"prompt":"What is a role of decomposers?","options":["Recycle nutrients from dead material","Create energy from nothing","Stop all chemical change","Remove the need for producers"],"answer":0,"why":"Decomposers break down material and return nutrients to ecosystems."},{"prompt":"Which is a chemical change?","options":["Cutting paper","Melting ice","Iron rusting","Breaking a glass"],"answer":2,"why":"Rusting produces different substances. The others change physical form."},{"prompt":"A car travels 150 km in 3 hours at a steady average rate. What is its average speed?","options":["50 km/h","75 km/h","147 km/h","450 km/h"],"answer":0,"why":"Average speed = distance ÷ time = 150 ÷ 3 = 50 km/h."},{"prompt":"An electric heater changes electrical energy mainly into what useful output?","options":["Thermal energy","New mass from nothing","Genetic information","No energy"],"answer":0,"why":"Its useful output is heat, or thermal energy."},{"prompt":"Water vapor cools and forms liquid droplets. What is this process?","options":["Evaporation","Condensation","Combustion","Erosion"],"answer":1,"why":"Gas changing into liquid is condensation."},{"prompt":"What is the probability of rolling an even number on a fair six-sided die?","options":["1/6","1/3","1/2","1"],"answer":2,"why":"Even outcomes are 2, 4 and 6: 3 of 6 equally likely outcomes, or 1/2."},{"prompt":"A bar chart starts its vertical scale at 95 rather than 0. What should you check?","options":["Whether the scale makes a small difference look large","Whether all numbers are automatically wrong","Whether charts never need labels","Whether every bar has the same value"],"answer":0,"why":"A truncated scale can exaggerate visual differences. Read values and labels."},{"prompt":"A study tests one fish species in one pond. Which is the most careful conclusion?","options":["The result proves what happens to every animal.","The result concerns the tested species and conditions; broader claims need more evidence.","No conclusion can mention the measured fish.","All ponds are identical."],"answer":1,"why":"Scope of conclusions should match the sample and conditions."},{"prompt":"A hypothesis predicts no change, but repeated measurements show a clear change. What is appropriate?","options":["Hide the measurements","Revise or reject the hypothesis using the evidence","Declare evidence unnecessary","Repeat only successful-looking results"],"answer":1,"why":"Scientific reasoning follows evidence, including contradictory results."}]},{"id":"social","name":"Social studies","summary":"Analyze history, civics, economics, geography and sources.","time":"Official test: 70 minutes","lessons":[{"title":"Read historical sources","text":"A primary source comes from the period or event being studied, such as a diary or original speech. A secondary source analyzes or interprets earlier events. Ask who created the source, when, for whom, and for what purpose. A primary source can still be biased or incomplete.","example":"A diary written during an event is primary. A later historian's book discussing that event is secondary."},{"title":"Claims, viewpoints and civics","text":"Separate a fact that can be checked from an opinion or judgment. Identify the audience and purpose of political writing. In the U.S. federal government, legislative, executive and judicial branches have different roles; checks and balances limit concentration of power.","example":"\"Attendance was 200\" is a checkable claim. \"It was the best meeting ever\" is a judgment."},{"title":"Economics and data","text":"Scarcity means resources are limited relative to wants. Opportunity cost is the next-best alternative given up when choosing. Read tables and graph labels carefully. A percentage-point change is subtraction between percentages; a relative percent change divides by the original value.","example":"An unemployment rate rising from 4% to 6% rises 2 percentage points. Its relative increase is (6 − 4) ÷ 4 = 50%."},{"title":"Founding ideas and constitutional government","text":"The U.S. Constitution establishes the federal government's framework. Federalism divides powers between national and state governments. Separation of powers divides functions among branches, while checks and balances let branches limit one another. Interpret constitutional passages with their actual wording.","example":"A presidential veto is one check on legislation; Congress can override it with the constitutionally required votes."},{"title":"Rights, responsibilities and participation","text":"Civil liberties protect individual freedoms against government interference. Civic participation includes voting where eligible, communicating with officials and joining community discussion. When reading rights-related passages, distinguish the stated rule from your opinion about it.","example":"A passage about peaceful expression can support a claim about civil liberties. It does not mean every action is lawful in every setting."},{"title":"U.S. history and cause-and-effect reasoning","text":"Put events in order and examine multiple causes and consequences. Correlation in time alone does not prove cause. Compare sources from different viewpoints. Major U.S. history topics include founding, slavery and abolition, industrialization, wars and civil-rights struggles.","example":"If two events happen in the same year, the date alone does not prove one caused the other. You need evidence of a connection."},{"title":"Economics: supply, demand and incentives","text":"Demand describes willingness and ability to buy at different prices. Supply describes willingness and ability to sell. Other things equal, a supply increase can put downward pressure on price. Incentives can change behavior; opportunity costs and tradeoffs remain.","example":"If more suppliers offer the same product while demand is unchanged, the simple supply-and-demand model predicts a lower equilibrium price."},{"title":"Geography, maps and population data","text":"Read map legends, scale, direction and dates. Absolute numbers and per-person rates answer different questions. Physical geography and resources can influence settlement and trade, but avoid assuming one factor explains everything. A map shows selected information, not all reality.","example":"At a scale of 1 cm = 20 km, 3 cm represents 60 km. A larger total population does not necessarily mean a higher population density."}],"questions":[{"prompt":"Which is a primary source for a 1940 factory strike?","options":["A diary written by a worker during the strike","A textbook published in 2020","A modern summary video","A later encyclopedia entry"],"answer":0,"why":"The diary is from the period being studied. It still needs evaluation for perspective and reliability."},{"prompt":"Which statement is an opinion?","options":["The report lists 300 households.","The council met on Tuesday.","This is the best policy the city has ever had.","The vote was 5 to 2."],"answer":2,"why":"\"Best\" is a judgment. The other statements can be checked against records."},{"prompt":"Which U.S. federal branch generally makes laws?","options":["Judicial","Legislative","Executive alone","None"],"answer":1,"why":"Congress is the legislative branch. It makes federal laws; other branches have distinct roles and checks."},{"prompt":"You can work an extra shift or attend a class, but not both. You choose the class. What is a possible opportunity cost?","options":["The wages from the shift you gave up","Every wage ever earned","The classroom's color","No alternative was given up"],"answer":0,"why":"Opportunity cost is the next-best alternative forgone. Here it can include the missed shift's wages."},{"prompt":"A rate rises from 10% to 13%. How many percentage points did it rise?","options":["3","13","23","30"],"answer":0,"why":"Subtract the percentages: 13 − 10 = 3 percentage points. Relative percent increase would be a different calculation."},{"prompt":"A pamphlet urges voters to support a candidate. What should a reader consider?","options":["It has no point of view.","Its purpose and evidence, because it is trying to persuade.","All its claims are automatically false.","Its font proves its accuracy."],"answer":1,"why":"Persuasive sources need evaluation, not automatic acceptance or rejection. Examine their claims, evidence, audience and purpose."},{"prompt":"What does federalism describe?","options":["Division of powers between national and state governments","One branch doing everything","Only local sports rules","No governments"],"answer":0,"why":"Federalism distributes governmental powers between national and state levels."},{"prompt":"A president vetoes a bill. Which principle does this illustrate?","options":["Checks and balances","No separation of powers","Rule by the courts alone","A ban on lawmaking"],"answer":0,"why":"The veto is an executive check on legislative action."},{"prompt":"Which is civic participation?","options":["Contacting an elected official about a community issue","Ignoring all public issues","Falsifying a ballot","Assuming a rumor is law"],"answer":0,"why":"Communicating with officials is one way to participate in civic life."},{"prompt":"Why compare historical sources with different viewpoints?","options":["To identify agreements, conflicts and perspective","To make every source identical","To ignore dates","To prove the newest source is always right"],"answer":0,"why":"Different perspectives can reveal omissions and disagreements."},{"prompt":"Two events occur in the same month. What else is needed to claim one caused the other?","options":["Evidence of a causal connection","Only the shared month","A matching font","Nothing"],"answer":0,"why":"Timing alone does not establish cause."},{"prompt":"An account was written decades after an event from earlier records. It is generally what kind of source?","options":["Secondary","Eyewitness primary by definition","A physical law","An experiment"],"answer":0,"why":"An interpretation based on earlier records is a secondary source."},{"prompt":"In a simple model, supply increases while demand stays the same. What pressure on price is expected?","options":["Downward","Always upward","Exactly none in every case","Price must disappear"],"answer":0,"why":"Other things equal, increased supply tends to lower equilibrium price."},{"prompt":"Why can a discount change buyer behavior?","options":["It changes an incentive by lowering the price","It removes every tradeoff","It makes resources unlimited","It proves every item is needed"],"answer":0,"why":"A lower price can make a purchase more attractive, but choices and scarcity remain."},{"prompt":"A map scale is 1 cm = 15 km. What does 4 cm represent?","options":["19 km","30 km","60 km","150 km"],"answer":2,"why":"4 × 15 = 60 km."},{"prompt":"Town A has 1,000 residents in 10 km². What is its population density?","options":["10 people/km²","100 people/km²","1,000 people/km²","10,000 people/km²"],"answer":1,"why":"Population density = population ÷ area = 1,000 ÷ 10 = 100 people/km²."},{"prompt":"Which comparison adjusts for population size?","options":["Incidents per 1,000 residents","Only total incidents","Only the town name","Only land color on a map"],"answer":0,"why":"A per-person rate accounts for different population sizes."},{"prompt":"Which should you read before interpreting map colors?","options":["The legend","Only the title's font","The paper thickness","No labels"],"answer":0,"why":"The legend explains what colors and symbols represent."},{"prompt":"A factory's output rises from 200 to 250 units. What is the relative percent increase?","options":["20%","25%","50%","125%"],"answer":1,"why":"Increase is 50. Divide by the original 200: 0.25, or 25%."},{"prompt":"Why does a source's intended audience matter?","options":["It can influence wording, emphasis and persuasion","It proves every claim false","It replaces evidence","It makes dates unimportant"],"answer":0,"why":"Audience and purpose help explain a source's perspective. Still check evidence."}]}];const study="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAJYA4QDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7JooooAKKKKAFFQy/ex7VLUUv3gamWw0YFz8s7j3qtGev1qzqXy3bj1qpGeWriludC2Oqs23WyH2qO4yZPSjTDmzT6U+Zec117xRz9SndREJms1h3q9d3IyUzzVGXkcGuGs03oUiBly/WrcD7Ux0ot4ARk1Fe4i5DVzS91XKRR1e2nnbcgOPaqliJbd/nU/jXQWlzAYfmYVFcG2kBxjNS7JcyY+W5l6nqiRQZzzXJ3utzPIPLJ4NaGv2sks2EPy57VSi0oZVnHfnNeZWnUqS0Ea9rr939nUKrE11Hh3VDdRgScN3BqtYw6fHZqHVRgc1Vvbq2tTvtgC3tXrUlOjaUp3RW5Z8eMPsHXoRXl2tyfKK6XxDrj3ieQVZR3yK5bUYmnQBetZVsZSnKyZcdEXNDfIXmu20o5QVyXhrTZiVL9K7O2RIAMnpU/XIU7RWoWuWY0ZmbjivP/GaEajjHY16GbyGKEsSMY61yGuy2krPM5TPvVYjFxo0+aQrHATj5jVeQHFTarexCZvL55rLe6k684riWZU2ZuViSQ1wvifjUAfeuta9Xdhq5LxSQ1yHU8ZrvoVY1NYk1GnEWwfOK6DTz0rmtOPIro9PJ4rpRzvU6Gyb5cVfj4rNsulaMdbxMWS54pjGlPSmMeKoBrNzTlkO7rULmmhuaAOv8HNm4Ga9FgPyD6V49pF+9nKHU12uj+KIZcJI2D70jopySVjqruJJYyhHUV5f438OtDK9zCvHUgV6Tb3kNwAUcGq+rQx3MXluM5pSVy5JSR8/31ueuKltYyYK77xF4U+UyQLXLNp81tlJEI/CsI07Suc7TRSsJDFcAHpXQxtuXNYMkBWQMBWxZEmIZramraEk7Dio2GKmpjCtQIs804HikI9qQUCHZzTc0vamigB6npVuwb/SUqkDVmxP+kJ9amWxpT+JGpcn9+foK4b4nHMEH++K7if8A1pOe1cP8TQTDD/vivCl
